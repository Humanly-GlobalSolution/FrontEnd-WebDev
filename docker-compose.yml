# Referência opcional. Não executar se o Orion local já estiver funcionando.
name: farol-amigo

services:
  mongo:
    image: ${MONGO_IMAGE:-mongo:4.4}
    restart: unless-stopped
    command: ["mongod", "--bind_ip_all"]
    volumes:
      - mongo-data:/data/db
    networks:
      - database
    healthcheck:
      test: ["CMD", "mongo", "--quiet", "--eval", "quit(db.adminCommand('ping').ok ? 0 : 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  orion:
    image: ${ORION_IMAGE:-fiware/orion:4.5.0}
    restart: unless-stopped
    command: ["-dbURI", "mongodb://mongo:27017", "-logLevel", "WARN"]
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "127.0.0.1:1026:1026"
    networks:
      - database
      - broker

  app:
    profiles: ["app"]
    build: .
    restart: unless-stopped
    env_file: .env.local
    environment:
      CROSSINGS_SOURCE: orion
      ORION_BASE_URL: http://orion:1026
      HOSTNAME: 0.0.0.0
    depends_on:
      orion:
        condition: service_started
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - broker

volumes:
  mongo-data:

networks:
  database:
    internal: true
  broker:
