# Preparação futura. Não usado pelo comando docker compose local.
name: farol-amigo-azure
services:
  mongo:
    image: ${MONGO_IMAGE:?Defina uma imagem Mongo validada e mantida}
    restart: unless-stopped
    command: ["mongod", "--bind_ip_all"]
    volumes: ["mongo-data:/data/db"]
    networks: [database]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand('ping').ok ? 0 : 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
  orion:
    image: ${ORION_IMAGE:-fiware/orion:4.5.0}
    restart: unless-stopped
    command: ["-dbURI", "mongodb://mongo:27017", "-logLevel", "WARN"]
    depends_on:
      mongo:
        condition: service_healthy
    networks: [database, broker]
  gateway:
    image: caddy:2
    restart: unless-stopped
    environment:
      ORION_DOMAIN: ${ORION_DOMAIN:?Defina o dominio do Orion}
      ORION_GATEWAY_TOKEN: ${ORION_GATEWAY_TOKEN:?Defina um token aleatorio}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    ports: ["80:80", "443:443"]
    networks: [broker, internet]
    depends_on: [orion]
volumes:
  mongo-data:
  caddy-data:
  caddy-config:
networks:
  database:
    internal: true
  broker:
    internal: true
  internet:
